name: Compilar YORUMI (APK)

# Compilacion manual desde la pestana Actions del repositorio.
# Genera un APK instalable (build debug firmado con clave de desarrollo)
# y lo deja como artefacto descargable del run.

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar el codigo
        uses: actions/checkout@v4

      - name: Instalar JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Crear archivos locales de compilacion
        run: |
          cat > local.properties <<'EOF'
          UKIKU_ADMOB_ID=
          APPCOINS_IAB_KEY=
          APPCOINS_IAB_UPDATE_ACTION=
          APPCOINS_IAB_BIND_ACTION=
          APPCOINS_DEV_IAB_BIND_ACTION=
          APPCOINS_DEV_IAB_BIND_PACKAGE=
          APPCOINS_ADDRESS=
          DROPBOX_TOKEN=
          EASTER_SEARCH=
          UKIKU_PWD_12=
          UKIKU_PWD_16=
          UKIKU_PWD_32=
          UKIKU_ADM_FILE=
          UKIKU_APPODEAL_KEY=
          UKIKU_TWITTER_API_KEY=
          UKIKU_TWITTER_API_SECRET=
          EOF
          cat > app/google-services.json <<'EOF'
          {
            "project_info": {
              "project_number": "123456789012",
              "project_id": "yorumi-personal",
              "storage_bucket": "yorumi-personal.appspot.com"
            },
            "client": [
              {
                "client_info": {
                  "mobilesdk_app_id": "1:123456789012:android:0123456789abcdef0123456789",
                  "android_client_info": { "package_name": "com.goenji007.yorumi" }
                },
                "oauth_client": [],
                "api_key": [ { "current_key": "AIzaSyDummyKeySoloParaCompilarYorumi123" } ],
                "services": { "appinvite_service": { "other_platform_oauth_client": [] } }
              }
            ],
            "configuration_version": "1"
          }
          EOF

      - name: Compilar el APK
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Subir el APK como artefacto
        uses: actions/upload-artifact@v4
        with:
          name: YORUMI-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
